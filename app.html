<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klare Taal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1327" media="(prefers-color-scheme: dark)">
<title>Klare Taal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, picture "tiles" framed like Delft porcelain; Dutch text in a reading serif, app chrome in a plain sans. */
:root {
  --porcelain: #F3F6FC;
  --surface: #FFFFFF;
  --ink: #13203F;
  --muted: #5A6787;
  --line: #CCD7EE;
  --delft: #1F4F9E;
  --delft-deep: #153C7C;
  --delft-soft: #E1E9F8;
  --orange: #E2701B;
  --good: #1B8A4B;
  --good-soft: #DDF3E5;
  --bad: #C4372C;
  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgb(19 32 63 / .06), 0 6px 18px rgb(19 32 63 / .07);
  --f-dutch: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --porcelain: #0C1327; --surface: #151F3C; --ink: #E7EDFB; --muted: #96A3C6; --line: #29396A;
    --delft: #86AAEE; --delft-deep: #B3C8F4; --delft-soft: #1C2A54; --orange: #F29350;
    --good: #4FC683; --good-soft: #143A28; --bad: #F2766C; --bad-soft: #43201F;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --porcelain: #0C1327; --surface: #151F3C; --ink: #E7EDFB; --muted: #96A3C6; --line: #29396A;
  --delft: #86AAEE; --delft-deep: #B3C8F4; --delft-soft: #1C2A54; --orange: #F29350;
  --good: #4FC683; --good-soft: #143A28; --bad: #F2766C; --bad-soft: #43201F;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--porcelain); color: var(--ink);
  font: 16px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
[hidden] { display: none !important; }
#app { max-width: 540px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; }

/* ---------- shared bits ---------- */
.btn {
  border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 1.02rem;
  background: var(--delft); color: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; transition: transform .08s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; }
.btn.ghost { background: transparent; color: var(--delft); box-shadow: inset 0 0 0 2px var(--line); }
.btn.wide { width: 100%; }
.btn.good { background: var(--good); }
.btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--delft-soft); color: var(--delft);
  display: inline-grid; place-items: center; flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { transform: scale(.94); }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dutch { font-family: var(--f-dutch); }
.hint { color: var(--muted); font-size: .86rem; text-align: center; }

/* ---------- Delft picture tile ---------- */
.pic {
  position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; container-type: inline-size;
  background:
    radial-gradient(circle at 0 0, var(--delft-soft) 0 11%, transparent 11.5%),
    radial-gradient(circle at 100% 0, var(--delft-soft) 0 11%, transparent 11.5%),
    radial-gradient(circle at 0 100%, var(--delft-soft) 0 11%, transparent 11.5%),
    radial-gradient(circle at 100% 100%, var(--delft-soft) 0 11%, transparent 11.5%),
    var(--surface);
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px var(--delft), inset 0 0 0 5px var(--surface), inset 0 0 0 6px var(--line), var(--shadow);
  overflow: hidden; user-select: none;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1;
}
.pic .scene {
  position: absolute; inset: 0; padding: 11cqw; display: flex; align-items: center; justify-content: center;
  flex-wrap: nowrap; align-content: center; gap: 3cqw;
}
.pic .n1 { font-size: 44cqw; } .pic .n2 { font-size: 26cqw; } .pic .n3 { font-size: 18cqw; }
.pic .n4 { font-size: 15cqw; } .pic .n6 { font-size: 12cqw; } .pic .n9 { font-size: 9cqw; }
.pic .tk { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.pic .rep { display: flex; flex-wrap: wrap; justify-content: center; gap: .08em; max-width: 62cqw; flex: 0 1 auto; min-width: 0; }
.pic .stack { display: flex; flex-direction: column; align-items: center; gap: .02em; }
.pic .spacer { height: .35em; }
.pic .big { font-size: 1.45em; } .pic .small { font-size: .5em; }
.pic.has-hl .tk:not(.hl) { opacity: .3; filter: grayscale(.6); }
.pic .hl { filter: drop-shadow(0 0 .06em var(--orange)) drop-shadow(0 0 .06em var(--orange)); }
.pic .strike::after {
  content: ""; position: absolute; left: -8%; right: -8%; top: 50%; height: .09em; border-radius: .05em;
  background: var(--bad); transform: rotate(-35deg); box-shadow: 0 0 0 .025em var(--surface);
}
.pic .inside { position: relative; }
.pic .inside > :first-child { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.55); z-index: 1; }
.pic .front { position: relative; }
.pic .front > :last-child { position: absolute; right: -.25em; bottom: -.1em; font-size: .62em; z-index: 1; }
.pic .num { font-family: var(--f-dutch); font-weight: 700; color: var(--delft); font-size: .7em; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pic .price {
  font-family: var(--f-dutch); font-weight: 700; font-size: .42em; color: var(--ink); background: var(--delft-soft);
  padding: .18em .45em .18em .7em; border-radius: .2em .5em .5em .2em; position: relative; white-space: nowrap;
  box-shadow: inset 0 0 0 .05em var(--delft);
}
.pic .price::before { content: ""; position: absolute; left: .22em; top: 50%; width: .16em; height: .16em; border-radius: 50%; background: var(--surface); transform: translateY(-50%); box-shadow: 0 0 0 .03em var(--delft); }
.pic svg.clock { width: 1em; height: 1em; }
.pic .n1 svg.clock { width: .9em; height: .9em; }
.pic .week { display: flex; gap: .7cqw; flex: none; font-family: var(--f-ui); }
.pic .week span, .pic .months span {
  font-size: 3.6cqw; width: 7cqw; height: 11cqw; display: grid; place-items: center; border-radius: 1.6cqw;
  background: var(--delft-soft); color: var(--muted); font-weight: 700;
}
.pic .week span.on, .pic .months span.on { background: var(--delft); color: var(--surface); }
.pic .months { display: grid; grid-template-columns: repeat(4, auto); gap: 1.2cqw; font-family: var(--f-ui); }
.pic .months span { width: 12cqw; height: 10cqw; font-size: 4.4cqw; }
.pic .tl { display: flex; align-items: center; gap: 1.6cqw; padding-top: 8cqw; }
.pic .tl .cell { position: relative; border-radius: 1.6cqw; background: var(--delft-soft); box-shadow: inset 0 0 0 .4cqw var(--line); }
.pic .tl .cell.on { background: var(--delft); box-shadow: none; }
.pic .tl .cell.now { outline: .8cqw solid var(--orange); outline-offset: .6cqw; }
.pic .tl .cell.now::before { content: "📍"; position: absolute; bottom: calc(100% + 1.5cqw); left: 50%; transform: translateX(-50%); font-size: 7cqw; }
.pic .tl.d .cell { width: 9cqw; height: 9cqw; } .pic .tl.w .cell { width: 11cqw; height: 7cqw; } .pic .tl.y .cell { width: 11cqw; height: 11cqw; border-radius: 50%; }
.pic.mini { width: 3.4rem; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--delft), var(--shadow); background: var(--surface); }

/* ---------- home ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 14px 8px; }
.wordmark { font-family: var(--f-dutch); font-weight: 700; font-size: 1.55rem; letter-spacing: -.01em; color: var(--delft-deep); margin-right: auto; }
.wordmark em { font-style: italic; font-weight: 500; color: var(--orange); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.hero {
  margin-top: 8px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px;
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
}
.hero .pic { width: 96px; }
.hero h2 { margin: 4px 0 12px; font-family: var(--f-dutch); font-size: 1.35rem; line-height: 1.2; text-wrap: balance; }
.hero .btn { width: 100%; }
.review-card { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); background: var(--delft-soft); border: 0; text-align: left; width: 100%; }
.review-card b { display: block; }
.review-card span { color: var(--muted); font-size: .88rem; }
.review-card .count { margin-left: auto; font-family: var(--f-dutch); font-weight: 700; font-size: 1.6rem; color: var(--delft); font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 18px; margin: 18px 2px 6px; color: var(--muted); font-size: .88rem; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--delft); border-radius: inherit; transition: width .3s; }
.units { display: flex; flex-direction: column; gap: 12px; padding-block: 12px 40px; }
.unit { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.unit-head { width: 100%; border: 0; background: none; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; text-align: left; }
.unit-head .ico { font-size: 1.7rem; width: 44px; height: 44px; display: grid; place-items: center; background: var(--delft-soft); border-radius: 12px; }
.unit-head h3 { margin: 0; font-family: var(--f-dutch); font-size: 1.12rem; }
.unit-head .frac { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit.locked .unit-head { opacity: .55; }
.unit .bar { margin: 0 16px 0 72px; }
.lessons { list-style: none; margin: 0; padding: 8px 8px 10px; }
.lesson-row { width: 100%; border: 0; background: none; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 8px; border-radius: 10px; text-align: left; }
.lesson-row:not(:disabled):active { background: var(--delft-soft); }
.lesson-row:disabled { opacity: .45; cursor: default; }
.lesson-row .no { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; text-align: center; }
.lesson-row .ttl { font-family: var(--f-dutch); font-size: 1.02rem; }
.lesson-row .kind { display: block; font-size: .76rem; color: var(--muted); font-family: var(--f-ui); }
.lesson-row .st { font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--good); display: flex; align-items: center; gap: 4px; }
.lesson-row .st svg { width: 18px; height: 18px; }
.lesson-row.next { background: var(--delft-soft); }
.lesson-row:disabled .st { color: var(--muted); }
.lesson-row.next .st { color: var(--delft); }

/* ---------- session ---------- */
.sess-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; position: sticky; top: 0; background: var(--porcelain); z-index: 5; }
.sess-top .bar { flex: 1; height: 8px; }
.sess-top .icon-btn { width: 40px; height: 40px; background: transparent; color: var(--muted); }
.stage { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
.stage.anim { animation: rise .28s ease-out; }
@keyframes rise { from { opacity: .0; transform: translateY(8px); } }
.prompt-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.say { font-family: var(--f-dutch); font-size: clamp(1.4rem, 6.4vw, 2rem); line-height: 1.25; text-align: center; text-wrap: balance; margin: 0; font-weight: 600; }
.say.small { font-size: clamp(1.15rem, 5vw, 1.5rem); }
.intro-pic { width: min(78%, 340px); margin: 6px auto 0; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { border: 0; padding: 0; background: none; border-radius: 12px; position: relative; transition: transform .1s, opacity .25s; }
.choice:active { transform: scale(.97); }
.choice.right .pic { box-shadow: inset 0 0 0 4px var(--good), var(--shadow); }
.choice.wrong { opacity: .35; animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.focus-pic { width: min(60%, 260px); margin: 0 auto; }
.text-choices { display: flex; flex-direction: column; gap: 10px; }
.text-choice {
  border: 0; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); border-radius: 12px; padding: 14px 16px;
  font-family: var(--f-dutch); font-size: 1.12rem; text-align: left; min-height: 52px; transition: opacity .25s;
}
.text-choice.right { box-shadow: inset 0 0 0 3px var(--good); background: var(--good-soft); }
.text-choice.wrong { opacity: .4; animation: shake .3s; text-decoration: line-through; }
.sentence { font-family: var(--f-dutch); font-size: 1.35rem; line-height: 1.6; text-align: center; text-wrap: balance; }
.gap { display: inline-block; min-width: 3.4em; border-bottom: 3px solid var(--delft); color: var(--delft); font-weight: 700; padding: 0 .2em; }
.gap.filled { border-color: var(--good); color: var(--good); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  border: 0; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line), 0 2px 0 var(--line); border-radius: 10px;
  padding: 10px 14px; font-family: var(--f-dutch); font-size: 1.1rem; min-height: 46px; transition: opacity .2s;
}
.tile.used { opacity: 0; pointer-events: none; }
.tile.wrong { animation: shake .3s; opacity: .4; }
.tray { min-height: 64px; border-radius: 12px; background: var(--delft-soft); padding: 9px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.tray.right { background: var(--good-soft); } .tray.wrong { background: var(--bad-soft); }
.answer-input {
  width: 100%; font-family: var(--f-dutch); font-size: 1.3rem; padding: 14px 16px; border-radius: 12px; border: 0;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line);
}
.answer-input.right { box-shadow: inset 0 0 0 3px var(--good); } .answer-input.wrong { box-shadow: inset 0 0 0 3px var(--bad); }
.correction { text-align: center; font-family: var(--f-dutch); font-size: 1.1rem; }
.correction b { color: var(--good); }

/* mic */
.mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mic {
  width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--orange); color: #fff;
  display: grid; place-items: center; box-shadow: 0 6px 20px rgb(226 112 27 / .35); position: relative;
}
.mic svg { width: 38px; height: 38px; }
.mic.on { background: var(--bad); }
.mic.on::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--bad); animation: pulse 1.1s infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.heard { font-family: var(--f-dutch); font-size: 1.1rem; color: var(--muted); text-align: center; min-height: 1.5em; }
.words { text-align: center; font-family: var(--f-dutch); font-size: clamp(1.4rem, 6.4vw, 2rem); font-weight: 600; line-height: 1.3; text-wrap: balance; }
.words .ok { color: var(--good); } .words .no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 5px; }
.meter { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 320px; }
.meter .bar { flex: 1; height: 10px; border-radius: 5px; }
.meter b { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

/* dialogue */
.chat { display: flex; flex-direction: column; gap: 10px; }
.line { display: flex; gap: 10px; align-items: flex-end; max-width: 92%; }
.line.B { align-self: flex-end; flex-direction: row-reverse; }
.bubble {
  background: var(--surface); box-shadow: var(--shadow); border-radius: 16px 16px 16px 4px; padding: 10px 14px;
  font-family: var(--f-dutch); font-size: 1.08rem; border: 0; text-align: left; min-width: 0;
}
.line.B .bubble { background: var(--delft); color: var(--surface); border-radius: 16px 16px 4px 16px; }
.line.B.todo .bubble { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--orange); }
.line.B.passed .bubble { background: var(--good); }
.line .pic.mini { flex: none; }
.line.playing .bubble { outline: 3px solid var(--orange); outline-offset: 2px; }
.line .score { display: block; font-family: var(--f-ui); font-size: .78rem; font-weight: 700; opacity: .85; margin-top: 2px; }
.dock { position: sticky; bottom: 0; background: var(--porcelain); padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }

/* feedback bar */
.feedback { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback svg { width: 22px; height: 22px; flex: none; }
.feedback .dutch { font-weight: 600; }

/* end */
.end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding-block: 30px; }
.end .big { font-family: var(--f-dutch); font-size: 3.6rem; font-weight: 700; color: var(--delft); font-variant-numeric: tabular-nums; line-height: 1; }
.end h2 { font-family: var(--f-dutch); margin: 0; font-size: 1.6rem; }
.stars { font-size: 2rem; letter-spacing: .2em; color: var(--orange); }
.stars .off { color: var(--line); }
.end .list { width: 100%; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 16px; }
.end .list div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-family: var(--f-dutch); }
.end .list div:last-child { border: 0; }

/* settings */
.sheet { padding-block: 6px 40px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-family: var(--f-dutch); margin: 0; font-size: 1.5rem; }
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border: 0; }
.row label { flex: 1; min-width: 0; }
.row small { display: block; color: var(--muted); font-size: .82rem; }
.seg { display: inline-flex; background: var(--delft-soft); border-radius: 999px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 7px 11px; border-radius: 999px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--delft); box-shadow: var(--shadow); }
.switch { appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.switch:checked { background: var(--good); } .switch:checked::after { transform: translateX(20px); }
textarea { width: 100%; min-height: 90px; border-radius: 10px; border: 0; box-shadow: inset 0 0 0 2px var(--line); background: var(--porcelain); color: var(--ink); padding: 10px; font: .78rem/1.4 ui-monospace, Menlo, monospace; }
.note { font-size: .86rem; color: var(--muted); line-height: 1.5; }
.note b { color: var(--ink); }

    else if (findFocus(it, L.focus)) choices.push({ type: 'fill', item: it, lesson: L });
    steps.push(...choices);
    if (speak) steps.push({ type: 'speak', item: it });
  }
  return shuffle(steps);
}
function options(item, pool, n = 4) {
  const others = shuffle(pool.filter(o => o !== item && o.p !== item.p && o.t !== item.t));
  const uniq = []; for (const o of others) if (!uniq.some(u => u.p === o.p)) uniq.push(o);
  if (uniq.length < n - 1) { // borrow from neighbouring lessons for tiny pools
    for (const l of shuffle(LESSONS)) for (const o of l.items) if (uniq.length < n - 1 && o.p !== item.p && !uniq.some(u => u.p === o.p)) uniq.push(o);
  }
  return shuffle([item, ...uniq.slice(0, n - 1)]);
}

function startLesson(L) {
  unlockAudio();
  session = { kind: 'lesson', lesson: L, steps: lessonSteps(L), i: 0, scored: 0, correct: 0, wrongItems: new Set(), seenItems: new Set(L.items), speechScores: [] };
  runStep();
}
function startReview() {
  unlockAudio();
  let items = dueItems().slice(0, 12);
  if (!items.length) {
    const pool = LESSONS.filter(l => P.done[l.id]).flatMap(l => l.items).filter(it => P.items[it.key]);
    items = shuffle(pool).sort((a, b) => (P.items[a.key].b - P.items[b.key].b)).slice(0, 10);
  }
  if (!items.length) return toast('Finish a lesson first.');
  session = { kind: 'review', steps: reviewSteps(items), i: 0, scored: 0, correct: 0, wrongItems: new Set(), seenItems: new Set(items), speechScores: [] };
  runStep();
}

function sessionShell(content, dock) {
  const total = session.steps.length;
  let confirming = false;
  const closeBtn = h('button', { class: 'icon-btn', 'aria-label': 'Leave lesson', onclick: () => {
    if (confirming || session.i === 0) return viewHome();
    confirming = true; toast('Tap × again to leave. Progress in this lesson will be lost.');
    setTimeout(() => confirming = false, 2600);
  } }, svgEl('close'));
  const top = h('div', { class: 'sess-top' }, closeBtn, h('div', { class: 'bar' }, h('i', { style: `width:${session.i / total * 100}%` })));
  const stage = h('main', { class: 'stage anim' }, content);
  mount(top, stage, h('div', { class: 'dock' }, dock || []));
}

function runStep() {
  const st = session.steps[session.i];
  if (!st) return finishSession();
  const R = RENDER[st.type];
  R(st);
}
function advance(st) {
  if (!session) return;
  if (st && st.type && session.steps[session.i] !== st) return;
  session.i++; runStep();
}
function judge(st, ok) {
  if (st.counted) return;
  st.counted = true;
  session.scored++;
  if (ok) session.correct++;
  else if (st.item) {
    session.wrongItems.add(st.item);
    if (!st.retry) session.steps.push(Object.assign({}, st, { counted: false, retry: true }));
  }
}
function feedbackBar(ok, text) {
  return h('div', { class: 'feedback ' + (ok ? 'good' : 'bad'), role: 'status' }, svgEl(ok ? 'check' : 'x'), text ? h('span', { class: 'dutch' }, text) : (ok ? 'Goed!' : 'Not quite'));
}
const replayBtns = (item) => [

  h('button', { class: 'icon-btn', 'aria-label': 'Play slowly', onclick: () => play(item, true) }, svgEl('slow'))];

const RENDER = {
  intro(st) {

      renderPic(it.p, 'intro-pic'),

  },

  listen(st) { choosePic(st, false); },
  read(st) { choosePic(st, true); },

  pic2text(st) {
    const it = st.item, opts = options(it, st.pool);
    let locked = false;
    const dock = h('div', null, h('p', { class: 'hint' }, 'Choose the phrase that matches the picture'));
    const list = h('div', { class: 'text-choices' }, opts.map(o => h('button', { class: 'text-choice', onclick: async e => {
      if (locked) return;
      const b = e.currentTarget;
      if (o === it) {
        locked = true; judge(st, true); sfx('good'); b.classList.add('right');
        dock.replaceChildren(feedbackBar(true));
        await play(it); await sleep(350); advance(st);
      } else { judge(st, false); sfx('bad'); b.classList.add('wrong'); b.disabled = true; }
    } }, o.t)));

  },

  fill(st) {
    const it = st.item, f = findFocus(it, st.lesson.focus);
    const opts = shuffle([f.word.toLowerCase(), ...shuffle(st.lesson.focus.filter(w => w.toLowerCase() !== f.word.toLowerCase())).slice(0, 3)]);
    const gap = h('span', { class: 'gap' }, ' ');

    const row = h('div', { class: 'opts' }, opts.map(w => h('button', { class: 'tile', onclick: async e => {
      if (locked) return;
      if (w === f.word.toLowerCase()) {
        locked = true; judge(st, true); sfx('good');

        await play(it); await sleep(350); advance(st);
      } else { judge(st, false); sfx('bad'); e.currentTarget.classList.add('wrong'); e.currentTarget.disabled = true; }
    } }, w)));
    sessionShell([renderPic(it.p, 'focus-pic'), h('p', { class: 'sentence' }, f.before, gap, f.after), row], dock);
  },

  build(st) {
    const it = st.item, target = wordsOf(it.t);
    const extra = shuffle([...new Set(st.pool.filter(o => o !== it).flatMap(o => wordsOf(o.t)))].filter(w => !target.some(t => t.toLowerCase() === w.toLowerCase()))).slice(0, 2);

      judge(st, ok); sfx(ok ? 'good' : 'bad');
      tray.classList.add(ok ? 'right' : 'wrong');
      pool.querySelectorAll('button').forEach(b => b.disabled = true); tray.querySelectorAll('button').forEach(b => b.disabled = true);
      const cont = h('button', { class: 'btn wide' + (ok ? ' good' : ''), onclick: () => advance(st) }, 'Continue');
      dock.replaceChildren(ok ? feedbackBar(true) : feedbackBar(false, it.t), cont);
      await play(it);
      if (ok) { await sleep(300); advance(st); }
    } }, 'Check');
    const pool = h('div', { class: 'opts' }, shuffle([...target, ...extra]).map(w => {
      const b = h('button', { class: 'tile', onclick: () => {
        b.classList.add('used');
        const chip = h('button', { class: 'tile', onclick: () => { chip.remove(); placed.splice(placed.findIndex(p => p.chip === chip), 1); b.classList.remove('used'); check.disabled = !placed.length; } }, w);
        placed.push({ w, chip }); tray.append(chip); check.disabled = false;
      } }, w);
      return b;
    }));
    const dock = h('div', null, check);
    sessionShell([
      h('div', { class: 'prompt-row' }, renderPic(it.p, 'mini'), replayBtns(it)),

    const go = async () => {
      if (!input.value.trim()) return;
      const a = norm(input.value), b = norm(it.t), s = sim(a.replace(/ /g, ''), b.replace(/ /g, ''));

      const cont = h('button', { class: 'btn wide' + (ok ? ' good' : ''), onclick: () => advance(st) }, 'Continue');
      dock.replaceChildren(a === b ? feedbackBar(true) : feedbackBar(ok, it.t), cont);
      play(it);

    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    const dock = h('div', null, h('button', { class: 'btn wide', onclick: go }, 'Check'));

/* ---------- speaking ---------- */
function speechPanel(item, onDone, opts = {}) {
  // Builds the mic UI for one phrase. onDone({score, passed, skipped}) is called when the learner moves on.
  const mode = speechMode();
  const words = h('p', { class: 'words' }, item.t);
  const heard = h('p', { class: 'heard' }, '');
  const meterFill = h('i', { style: 'width:0%' });
  const meterNum = h('b', null, '');
  const meter = h('div', { class: 'meter', hidden: true }, h('div', { class: 'bar' }, meterFill), meterNum);
  const micBtn = h('button', { class: 'mic', 'aria-label': 'Speak' }, svgEl('mic'));
  const status = h('p', { class: 'hint' }, mode === 'sr' ? 'Tap the microphone and say the phrase' : 'Tap the microphone, say the phrase, then compare');
  const contBtn = h('button', { class: 'btn wide', disabled: true }, 'Continue');
  const skipBtn = h('button', { class: 'btn ghost wide' }, 'Skip speaking');
  let best = 0, attempts = 0, listening = null, passed = false;
  const threshold = S().strict;

  function finish(skipped) { if (listening) listening.stop(); onDone({ score: best, passed, skipped, attempts }); }
  contBtn.onclick = () => finish(false);
  skipBtn.onclick = () => finish(true);

  async function goSR() {
    if (listening) { listening.stop(); return; }
    stopAudio();
    micBtn.classList.add('on'); micBtn.replaceChildren(svgEl('stop'));
    status.textContent = 'Listening… speak now';
    heard.textContent = '';
    let alts = [];
    try {
      listening = recognize(t => heard.textContent = '“' + t + '”');
      alts = await listening.promise;
    } catch (err) {
      listening = null; micBtn.classList.remove('on'); micBtn.replaceChildren(svgEl('mic'));
      status.textContent = err === 'not-allowed' || err === 'service-not-allowed'
        ? 'Microphone or speech recognition is blocked. On iPhone: Settings › Safari › Microphone → Allow, and Settings › Siri › turn on Siri or Dictation.'
        : 'Speech recognition stopped (' + err + '). Tap the microphone to try again.';
      return;
    }
    listening = null; micBtn.classList.remove('on'); micBtn.replaceChildren(svgEl('mic'));
    if (!alts.length || !alts[0].trim()) { status.textContent = "I didn't hear anything. Tap the microphone and speak clearly."; return; }
    attempts++;
    const r = scoreSpeech(item.t, alts);
    best = Math.max(best, r.score);
    heard.textContent = '“' + r.said + '”';
    const tw = item.t.split(/\s+/);
    // map normalized word marks back onto display words (numbers in the display stay one word)
    let mi = 0;
    words.replaceChildren(...tw.map((w, i) => {
      const n = norm(w).split(' ').filter(Boolean).length || 0;
      const ok = n === 0 ? true : r.marks.slice(mi, mi + n).every(Boolean);
      mi += n;
      return [h('span', { class: ok ? 'ok' : 'no' }, w), i < tw.length - 1 ? ' ' : ''];
    }).flat());
    meter.hidden = false; meterFill.style.width = r.score + '%';
    meterFill.style.background = r.score >= threshold ? 'var(--good)' : r.score >= threshold - 20 ? 'var(--orange)' : 'var(--bad)';
    meterNum.textContent = r.score + '%';
    if (r.score >= threshold) {
      passed = true; sfx('good'); status.textContent = r.score >= 90 ? 'Uitstekend!' : 'Goed zo!';
      contBtn.disabled = false; contBtn.classList.add('good');
      if (opts.autoAdvance) { await sleep(900); finish(false); }
    } else {
      sfx('bad');
      status.textContent = attempts >= 3 ? 'Listen once more, then try again or continue.' : 'Words in red need work. Listen and try again.';
      if (attempts >= 2) contBtn.disabled = false;
    }
  }

  async function goRec() {
    if (listening) { listening.stop(); return; }
    stopAudio();
    try {
      const r = await recordClip(5);
      listening = r.ctl;
      micBtn.classList.add('on'); micBtn.replaceChildren(svgEl('stop')); status.textContent = 'Recording… tap to stop';
      const url = await r.done;
      listening = null; micBtn.classList.remove('on'); micBtn.replaceChildren(svgEl('mic'));
      attempts++;
      status.textContent = 'Compare your voice with the speaker:';
      const mine = new Audio(url);
      heard.replaceChildren(
        h('button', { class: 'btn ghost', onclick: () => { stopAudio(); mine.play(); } }, svgEl('play'), 'My voice'), ' ',
        h('button', { class: 'btn ghost', onclick: () => play(item) }, svgEl('speaker'), 'Speaker'));
      passed = true; best = 0; contBtn.disabled = false;
    } catch (e) {
      listening = null; micBtn.classList.remove('on'); micBtn.replaceChildren(svgEl('mic'));
      status.textContent = 'Microphone is blocked. Allow microphone access for this site in Safari settings.';
    }
  }
  micBtn.onclick = mode === 'sr' ? goSR : goRec;

  const body = [words, h('div', { class: 'prompt-row' }, replayBtns(item)), h('div', { class: 'mic-wrap' }, micBtn, status, meter, heard)];
  return { body, dock: [contBtn, skipBtn] };
}

function speakStep(st) {
  const it = st.item;
  const panel = speechPanel(it, r => {
    if (!session) return;
    if (!r.skipped) { judge(st, r.passed && r.attempts <= 2); session.speechScores.push(r.score); }
    advance(st);
  });
  sessionShell([renderPic(it.p, 'focus-pic'), ...panel.body], panel.dock);
  play(it);
}

/* ---------- dialogues ---------- */
function dialogueStep(st, roleplay) {
  const L = st.lesson;
  const chat = h('div', { class: 'chat' });
  const hint = h('p', { class: 'hint' }, roleplay ? 'Your turn: say the orange lines. Your partner speaks the others.' : 'Listen to the conversation. Tap a line to hear it again.');
  const dock = h('div', { class: 'dock-inner' });
  const area = h('div', null);
  sessionShell([hint, chat, area], dock);
  let i = 0, alive = true;
  const myToken = session;
  const lineEl = (it) => {
    const scoreEl = h('span', { class: 'score' });
    const bubble = h('button', { class: 'bubble', onclick: () => play(it) }, it.t, scoreEl);
    const row = h('div', { class: 'line ' + it.s }, renderPic(it.p, 'mini'), bubble);
    row.scoreEl = scoreEl;
    return row;
  };
  async function step() {
    if (session !== myToken || !alive) return;
    if (i >= L.items.length) {
      area.replaceChildren();
      dock.replaceChildren(...[h('button', { class: 'btn wide', onclick: () => { alive = false; advance(st); } }, 'Continue'),
        roleplay ? null : h('button', { class: 'btn ghost wide', onclick: () => { alive = false; dialogueStep(st, false); } }, 'Listen again')].filter(Boolean));
      return;
    }
    const it = L.items[i];
    const row = lineEl(it);
    chat.append(row);
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (roleplay && it.s === 'B' && speechMode() !== 'off') {
      row.classList.add('todo');
      const panel = speechPanel(it, r => {
        row.classList.remove('todo');
        if (!r.skipped) { row.classList.add('passed'); row.scoreEl.textContent = r.score ? r.score + '%' : '✓'; judge({ item: it, retry: true }, r.passed); session.speechScores.push(r.score); }
        area.replaceChildren(); dock.replaceChildren();
        i++; step();
      }, { autoAdvance: true });
      area.replaceChildren(h('div', { class: 'mic-wrap' }, panel.body[2]));
      dock.replaceChildren(...panel.dock);
      return;
    }
    if (roleplay && it.s === 'B') { // speaking disabled: model the line, learner reads along
      row.classList.add('playing'); await play(it); row.classList.remove('playing');
      dock.replaceChildren(h('button', { class: 'btn wide', onclick: () => { dock.replaceChildren(); i++; step(); } }, 'Next line'));
      return;
    }
    row.classList.add('playing');
    dock.replaceChildren(h('button', { class: 'btn ghost wide', onclick: () => { stopAudio(); } }, 'Skip line'));
    await play(it);
    row.classList.remove('playing');
    await sleep(450);
    i++; step();
  }
  step();
}

/* ---------- end of session ---------- */
function finishSession() {
  const s = session;
  const pct = s.scored ? s.correct / s.scored : 1;
  const t = today();
  for (const it of s.seenItems) {
    const r = P.items[it.key] || { b: 0, d: t };
    const wrong = s.wrongItems.has(it);
    r.b = wrong ? 1 : Math.min(r.b + 1, INTERVALS.length - 1);
    r.d = t + INTERVALS[r.b];
    P.items[it.key] = r;
  }
  if (s.kind === 'lesson') {
    const prev = P.done[s.lesson.id];
    P.done[s.lesson.id] = { best: Math.max(pct, prev ? prev.best : 0), at: Date.now() };
  }
  bumpStreak(); saveP();
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
  const speechAvg = s.speechScores.length ? Math.round(s.speechScores.reduce((a, b) => a + b, 0) / s.speechScores.length) : null;
  const tricky = [...s.wrongItems].slice(0, 6);
  const nx = nextLesson();
  mount(h('main', { class: 'end' },
    h('div', { class: 'stars', 'aria-label': stars + ' of 3 stars' }, [0, 1, 2].map(i => h('span', { class: i < stars ? '' : 'off' }, '★'))),
    h('div', { class: 'big' }, Math.round(pct * 100) + '%'),
    h('h2', null, pct >= .9 ? 'Uitstekend!' : pct >= .7 ? 'Goed gedaan!' : 'Blijf oefenen!'),
    h('p', { class: 'note' }, s.kind === 'lesson' ? `${s.lesson.title} complete` : 'Review complete',
      speechAvg != null ? ` · pronunciation ${speechAvg}%` : ''),
    tricky.length ? h('div', { class: 'list' }, h('div', { class: 'eyebrow' }, 'Coming back in your next review'), tricky.map(it => h('div', null, h('span', null, it.t), h('button', { class: 'icon-btn', 'aria-label': 'Play', onclick: () => play(it) }, svgEl('speaker'))))) : null,
    s.kind === 'lesson' && nx ? h('button', { class: 'btn wide', onclick: () => startLesson(nx) }, 'Next: ' + nx.title) : null,
    h('button', { class: 'btn ghost wide', onclick: viewHome }, 'Home')));
  session = null;
}

/* ---------- settings ---------- */
function seg(name, choices) {
  return h('div', { class: 'seg', role: 'group' }, choices.map(([v, label]) => h('button', { class: S()[name] === v ? 'on' : '', 'aria-pressed': String(S()[name] === v), onclick: e => {
    S()[name] = v; saveP(); if (name === 'theme') applyTheme();
    e.currentTarget.parentElement.querySelectorAll('button').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
    e.currentTarget.classList.add('on'); e.currentTarget.setAttribute('aria-pressed', 'true');
    if (name === 'rate') { unlockAudio(); play(LESSONS[0].items[0]); }
  } }, label)));
}
function toggle(name, id) {
  const el = h('input', { type: 'checkbox', class: 'switch', id, role: 'switch' });
  el.checked = !!S()[name];
  el.onchange = () => { S()[name] = el.checked; saveP(); };
  return el;
}
function viewSettings() {
  const mode = SR ? 'Speech recognition available: pronunciation is scored automatically.' : canRecord ? 'Speech recognition is not available in this browser, so speaking exercises record your voice for you to compare.' : 'Microphone is not available in this browser.';
  const exportBox = h('textarea', { id: 'export', readonly: true, hidden: true });
  const importBox = h('textarea', { id: 'import', placeholder: 'Paste a progress code here', hidden: true });
  let resetArmed = false;
  mount(
    h('header', { class: 'topbar' }, h('button', { class: 'icon-btn', 'aria-label': 'Back', onclick: viewHome }, svgEl('back')), h('div', { class: 'wordmark' }, 'Settings')),
    h('div', { class: 'sheet' },
      h('div', { class: 'group' },
        h('div', { class: 'row' }, h('label', null, 'Voice speed', h('small', null, 'Plays a sample when changed')), seg('rate', [[0.8, 'Slow'], [0.9, 'Calm'], [1, 'Normal']])),
        h('div', { class: 'row' }, h('label', { for: 'sw-speech' }, 'Speaking exercises', h('small', null, 'Turn off when you can’t talk out loud')), toggle('speech', 'sw-speech')),
        h('div', { class: 'row' }, h('label', null, 'Pronunciation', h('small', null, 'Score needed to pass')), seg('strict', [[60, 'Easy'], [70, 'Normal'], [82, 'Strict']])),
        h('div', { class: 'row' }, h('label', { for: 'sw-sfx' }, 'Sound effects'), toggle('sfx', 'sw-sfx')),
        h('div', { class: 'row' }, h('label', null, 'Theme'), seg('theme', [['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])),
        h('div', { class: 'row' }, h('label', { for: 'sw-unlock' }, 'Unlock all lessons', h('small', null, 'Skip ahead if you already know some Dutch')), toggle('unlock', 'sw-unlock'))),
      h('div', { class: 'group' }, h('div', { class: 'row' }, h('p', { class: 'note' }, h('b', null, 'Microphone. '), mode,
        SR ? ' On iPhone, Siri or Dictation must be turned on (Settings › Siri), and Safari must be allowed to use the microphone. Use the app in a Safari tab: speech recognition may not work from a Home Screen icon.' : ''))),
      h('div', { class: 'group' },
        h('div', { class: 'row' }, h('label', null, 'Back up progress', h('small', null, 'Progress lives in this browser only. Save this code somewhere safe.')),
          h('button', { class: 'btn ghost', onclick: async () => {
            exportBox.hidden = false; exportBox.value = btoa(unescape(encodeURIComponent(JSON.stringify(P)))); exportBox.select();
            try { await navigator.clipboard.writeText(exportBox.value); toast('Progress code copied'); } catch (e) { toast('Code selected. Copy it from the box.'); }
          } }, 'Copy code')),
        h('div', { class: 'row' }, exportBox),
        h('div', { class: 'row' }, h('label', null, 'Restore progress'), h('button', { class: 'btn ghost', onclick: () => {
          if (importBox.hidden) { importBox.hidden = false; importBox.focus(); return; }
          try { const p = JSON.parse(decodeURIComponent(escape(atob(importBox.value.trim())))); if (!p.done) throw 0; localStorage.setItem(STORE, JSON.stringify(p)); P = loadP(); applyTheme(); toast('Progress restored'); viewHome(); }
          catch (e) { toast('That code is not valid. Copy the whole code and try again.'); }
        } }, 'Restore')),
        h('div', { class: 'row' }, importBox),
        h('div', { class: 'row' }, h('label', null, 'Reset all progress'), h('button', { class: 'btn ghost', style: 'color:var(--bad)', onclick: e => {
          if (!resetArmed) { resetArmed = true; e.currentTarget.textContent = 'Tap to confirm'; return; }
          P = { done: {}, items: {}, streak: { last: 0, n: 0 }, settings: P.settings }; saveP(); toast('Progress reset'); viewHome();
        } }, 'Reset'))),
      h('p', { class: 'note' }, `${UNITS.length} units · ${LESSONS.length} lessons · ${LESSONS.reduce((s, l) => s + l.items.length, 0)} phrases. Voices: Microsoft Edge neural voices Fenna, Colette and Maarten.`)));
}

/* ================= boot ================= */
(function makeTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    g.fillStyle = '#1F4F9E'; g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#F3F6FC'; g.lineWidth = 6; g.strokeRect(14, 14, 152, 152);
    g.fillStyle = '#F3F6FC'; [[14, 14], [166, 14], [14, 166], [166, 166]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 16, 0, 7); g.fill(); });
    g.font = '700 74px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('KT', 90, 96);
    document.head.append(h('link', { rel: 'apple-touch-icon', href: c.toDataURL('image/png') }), h('link', { rel: 'icon', href: c.toDataURL('image/png') }));
  } catch (e) {}
})();
if (!DATA) app.append(h('p', { class: 'note' }, 'No lesson data. Run build.py to generate index.html.'));
else viewHome();
</script>
</body>
